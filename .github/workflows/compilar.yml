name: Compilar app Android y publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tablerista
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar la web dentro de la app
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r web/. android/app/src/main/assets/

      - name: Preparar llave de firma (desde secrets)
        env:
          KS_B64: ${{ secrets.TABLERISTA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/tablerista.keystore
            echo "Llave de firma cargada."
          else
            echo "::warning::Sin secret TABLERISTA_KEYSTORE_B64: se firma con llave de prueba."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          TABLERISTA_KEYSTORE_PASS: ${{ secrets.TABLERISTA_KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Armar sitio web con el APK para descargar
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp android/app/build/outputs/apk/release/app-release.apk _site/tablerista.apk

      - name: Guardar APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: tablerista-apk
          path: _site/tablerista.apk

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
